<!DOCTYPE html>
<html>
<head>
  <title>Talk You To Sleep</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-spinners@0.13.8/dist/ClipLoader.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #0d1a26;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #root {
      width: 100%;
      max-width: 600px;
      background-color: #1a2938;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #b0c4de;
      margin: 0;
    }
    h1 {
      font-size: 2em;
    }
    h2 {
        font-size: 1.2em;
        font-weight: 400;
        margin-bottom: 1rem;
    }
    .voice-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .voice-button {
      background-color: #2c3e50;
      border: 2px solid #34495e;
      color: #ecf0f1;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      font-size: 1em;
    }
    .voice-button:hover {
      background-color: #34495e;
      transform: translateY(-2px);
    }
    .voice-button.selected {
      background-color: #4a6fa5;
      border-color: #5d8ac7;
      box-shadow: 0 0 10px rgba(74, 111, 165, 0.5);
    }
    .chat-area {
        height: 300px;
        overflow-y: auto;
        padding: 15px;
        background-color: #0d1a26;
        border-radius: 8px;
        margin-top: 10px;
        display: flex;
        flex-direction: column-reverse;
    }
    .message-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .message {
      padding: 8px 12px;
      border-radius: 18px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.5s ease-in-out;
    }
    .message.ai {
      background-color: #2c3e50;
      color: #ecf0f1;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message.user {
      background-color: #4a6fa5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 10px;
      border: 2px solid #34495e;
      background-color: #2c3e50;
      color: #ecf0f1;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      background-color: #4a6fa5;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #5d8ac7;
    }
    button:disabled {
      background-color: #34495e;
      cursor: not-allowed;
    }
    .mic-button.listening {
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
        100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }
    .status {
        text-align: center;
        color: #7f8c8d;
        min-height: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="index.js"></script>

</body>
</html>
